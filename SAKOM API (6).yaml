        name: profile__department
        schema:
          type: string
      - in: query
        name: profile__role
        schema:
          type: string
          enum:
          - Assistant
          - Chef de projet
          - Consultant
          - Designer
          - Développeur
          - Finance/Admin
          - Managing Director
          - Rédacteur
        description: |-
          * `Chef de projet` - Chef de projet
          * `Designer` - Designer
          * `Développeur` - Développeur
          * `Rédacteur` - Rédacteur
          * `Consultant` - Consultant
          * `Assistant` - Assistant
          * `Managing Director` - Managing Director
          * `Finance/Admin` - Finance/Admin
