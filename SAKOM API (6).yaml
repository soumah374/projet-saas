        is_read:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type_str
      - created_at
      - id
      - message
      - object_id
      - recipient
      - recipient_name
      - type
      - updated_at
    NotificationRequest:
