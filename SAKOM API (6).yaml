components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nom de la catégorie
          maxLength: 100
      required:
      - id
      - name
    CategoryEnum:
      enum:
      - contract
      - proposal
      - report
      - presentation
      - design
      - video
      - audio
      - photo
      - other
      type: string
      description: |-
        * `contract` - Contrat
        * `proposal` - Proposition
        * `report` - Rapport
        * `presentation` - Présentation
        * `design` - Design
        * `video` - Vidéo
        * `audio` - Audio
        * `photo` - Photo
        * `other` - Autre
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nom de la catégorie
          maxLength: 100
      required:
      - name
    ClientProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
        adresse:
          type: string
          maxLength: 255
        ville:
          type: string
          maxLength: 100
        code_postal:
          type: string
          maxLength: 20
        pays:
          type: string
          maxLength: 100
        telephone:
          type: string
          maxLength: 20
        date_inscription:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
          default: true
      required:
      - date_inscription
      - id
    ClientProfileRequest:
      type: object
      properties:
        user_id:
          type: integer
        adresse:
          type: string
          maxLength: 255
        ville:
          type: string
          maxLength: 100
        code_postal:
          type: string
          maxLength: 20
        pays:
          type: string
          maxLength: 100
        telephone:
          type: string
          maxLength: 20
        is_active:
          type: boolean
          default: true
    ClientUserCreate:
      type: object
      properties:
        username:
          type: string
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        email:
          type: string
          format: email
          title: Adresse électronique
          maxLength: 254
        client_profile:
          $ref: '#/components/schemas/ClientProfile'
      required:
      - username
    ClientUserCreateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        email:
          type: string
          format: email
          title: Adresse électronique
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
        client_profile:
          $ref: '#/components/schemas/ClientProfileRequest'
      required:
      - password
      - password_confirm
      - username
    CustomTokenObtainPairRequest:
      type: object
      description: Sérialiseur personnalisé pour l'obtention de tokens JWT
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
          default: true
        current_manager:
          type: string
          readOnly: true
        projects_count:
          type: string
          readOnly: true
        team_members_count:
          type: string
          readOnly: true
        active_projects_count:
          type: integer
          readOnly: true
        manager_history:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentManagerHistory'
          readOnly: true
      required:
      - active_projects_count
      - created_at
      - current_manager
      - id
      - manager_history
      - name
      - projects_count
      - team_members_count
      - updated_at
    DepartmentManagerHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        manager:
          type: integer
          nullable: true
        manager_name:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          description: Raison du changement ou commentaires
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - manager_name
      - start_date
    DepartmentManagerHistoryRequest:
      type: object
      properties:
        manager:
          type: integer
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          description: Raison du changement ou commentaires
      required:
      - start_date
    DepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        is_active:
          type: boolean
          default: true
      required:
      - name
    Document:
      type: object
      description: Sérialiseur pour les documents
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        file:
          type: string
          format: uri
          pattern: (?:pdf|doc|docx|xls|xlsx|ppt|pptx|txt|jpg|jpeg|png|gif|mp4|avi|mp3|zip)$
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        file_size:
          type: integer
          readOnly: true
          description: Taille du fichier en bytes
        uploaded_by:
          type: integer
          readOnly: true
        uploaded_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_public:
          type: boolean
          default: false
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          default: other
        tags: {}
        project:
          type: string
          nullable: true
      required:
      - created_at
      - document_type
      - file
      - file_size
      - id
      - title
      - updated_at
      - uploaded_by
      - uploaded_by_name
    DocumentRequest:
      type: object
      description: Sérialiseur pour les documents
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        file:
          type: string
          format: binary
          pattern: (?:pdf|doc|docx|xls|xlsx|ppt|pptx|txt|jpg|jpeg|png|gif|mp4|avi|mp3|zip)$
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        is_public:
          type: boolean
          default: false
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          default: other
        tags: {}
        project:
          type: string
          minLength: 1
          nullable: true
      required:
      - document_type
      - file
      - title
    DocumentTypeEnum:
      enum:
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - txt
      - jpg
      - jpeg
      - png
      - gif
      - mp4
      - avi
      - mp3
      - zip
      - other
      type: string
      description: |-
        * `pdf` - PDF
        * `doc` - Document Word
        * `docx` - Document Word
        * `xls` - Feuille de calcul Excel
        * `xlsx` - Feuille de calcul Excel
        * `ppt` - Présentation PowerPoint
        * `pptx` - Présentation PowerPoint
        * `txt` - Fichier texte
        * `jpg` - Image JPEG
        * `jpeg` - Image JPEG
        * `png` - Image PNG
        * `gif` - Image GIF
        * `mp4` - Vidéo MP4
        * `avi` - Vidéo AVI
        * `mp3` - Audio MP3
        * `zip` - Archive ZIP
        * `other` - Autre
    IntervenantProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nom du profil
          maxLength: 100
      required:
      - id
      - name
    IntervenantProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nom du profil
          maxLength: 100
      required:
      - name
    Notification:
      type: object
