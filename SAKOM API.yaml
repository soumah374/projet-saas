  /api/v1/documents/:
    get:
      operationId: documents_list
      description: ViewSet pour la gestion des documents
      parameters:
      - in: query
        name: category
        schema:
          type: string
          default: other
          enum:
          - audio
          - contract
          - design
          - other
          - photo
          - presentation
          - proposal
          - report
          - video
        description: |-
          * `contract` - Contrat
          * `proposal` - Proposition
          * `report` - Rapport
          * `presentation` - Présentation
          * `design` - Design
          * `video` - Vidéo
          * `audio` - Audio
          * `photo` - Photo
          * `other` - Autre
      - in: query
        name: document_type
        schema:
          type: string
          enum:
          - avi
          - doc
          - docx
          - gif
          - jpeg
          - jpg
          - mp3
          - mp4
          - other
          - pdf
          - png
          - ppt
          - pptx
          - txt
          - xls
          - xlsx
          - zip
        description: |-
          * `pdf` - PDF
          * `doc` - Document Word
          * `docx` - Document Word
          * `xls` - Feuille de calcul Excel
          * `xlsx` - Feuille de calcul Excel
          * `ppt` - Présentation PowerPoint
          * `pptx` - Présentation PowerPoint
          * `txt` - Fichier texte
          * `jpg` - Image JPEG
          * `jpeg` - Image JPEG
          * `png` - Image PNG
          * `gif` - Image GIF
          * `mp4` - Vidéo MP4
          * `avi` - Vidéo AVI
          * `mp3` - Audio MP3
          * `zip` - Archive ZIP
          * `other` - Autre
      - in: query
        name: is_public
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - documents
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentList'
          description: ''
    post:
      operationId: documents_create
      description: ViewSet pour la gestion des documents
      tags:
      - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
  /api/v1/documents/{id}/:
    get:
      operationId: documents_retrieve
