components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Category700Enum:
      enum:
      - Corporate
      - Marketing
      - Institutionnel
      - Commercial
      - Interne
      type: string
      description: |-
        * `Corporate` - Corporate
        * `Marketing` - Marketing
        * `Institutionnel` - Institutionnel
        * `Commercial` - Commercial
        * `Interne` - Interne
    CustomTokenObtainPairRequest:
      type: object
      description: Sérialiseur personnalisé pour l'obtention de tokens JWT
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    Document:
      type: object
      description: Sérialiseur pour les documents
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        file:
          type: string
          format: uri
          pattern: (?:pdf|doc|docx|xls|xlsx|ppt|pptx|txt|jpg|jpeg|png|gif|mp4|avi|mp3|zip)$
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        file_size:
          type: integer
          readOnly: true
          description: Taille du fichier en bytes
        uploaded_by:
          type: integer
          readOnly: true
        uploaded_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_public:
          type: boolean
          default: false
        category:
          allOf:
          - $ref: '#/components/schemas/DocumentCategoryEnum'
          default: other
