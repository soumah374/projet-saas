name: CI - Build & Deploy Backend

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: build_backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/project-backend:latest
            ghcr.io/${{ github.repository_owner }}/project-backend:${{ github.sha }}

      - name: Set backend image output
        run: echo "backend_image=ghcr.io/${{ github.repository_owner }}/project-backend:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Node.js for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          # Retry npm ci up to 3 times
          for i in 1 2 3; do
            npm ci && break || sleep 10
          done
          npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build and push frontend image
        id: build_frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/project-frontend:latest
            ghcr.io/${{ github.repository_owner }}/project-frontend:${{ github.sha }}

  deploy-to-vps:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Wait a moment
        run: echo "Starting remote deploy..."
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend-dist

      - name: Debug SSH Connection
        run: |
          set -euo pipefail
          set -x
          echo "=== SSH Debug Info ==="
          echo "VPS_HOST: ${{ secrets.develop.VPS_HOST }}"
          echo "VPS_USER: ${{ secrets.develop.VPS_USER }}"
          echo "VPS_SSH_PORT (raw): '${{ secrets.develop.VPS_SSH_PORT }}'"
          # Do not print secret contents
          echo "VPS_SSH_KEY length: $(echo -n '${{ secrets.VPS_SSH_KEY }}' | wc -c)"

          # Setup SSH directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key using printf to preserve newlines exactly
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Verify key format (first and last lines)
          echo "=== Key verification ==="
          head -n 1 ~/.ssh/deploy_key || true
          tail -n 1 ~/.ssh/deploy_key || true

          # Determine port in shell (fallback to 22)
          PORT='22'
          if [ -n "${{ secrets.VPS_SSH_PORT }}" ]; then
            PORT='${{ secrets.VPS_SSH_PORT }}'
          fi

          # Add host to known_hosts to avoid interactive prompt
          ssh-keyscan -p "$PORT" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Test connection with retries
          echo "=== Testing SSH Connection ==="
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3..."
            if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" -p "$PORT" "echo 'SSH connection successful!'; whoami; pwd"; then
              echo "✓ Connection successful"
              break
            else
              echo "✗ Attempt $attempt failed"
              if [ $attempt -lt 3 ]; then
                sleep 5
              else
                echo "✗ All attempts failed - check VPS_SSH_KEY (private key), VPS_HOST, VPS_USER, VPS_SSH_PORT"
                exit 1
              fi
            fi
          done

      - name: Copy frontend to VPS (/var/www/html)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "./frontend-dist/*"
          target: /var/www/html

      - name: Deploy backend and finalize frontend
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH:-/home/${{ secrets.VPS_USER }}/project-saas }}"
            echo "📦 Deploying from: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            
            # Pull latest images
            echo "🐳 Pulling Docker images..."
            docker-compose -f docker-compose-prod.yml pull || true
            
            # Set environment variables if needed
            export GITHUB_REPO_OWNER="${{ github.repository_owner }}"
            export SECRET_KEY="${{ secrets.SECRET_KEY }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export ALLOWED_HOSTS="${{ secrets.ALLOWED_HOSTS }}"
            
            # Start all services (db, redis, backend, nginx)
            echo "🚀 Starting services..."
            docker-compose -f docker-compose-prod.yml up -d --no-deps backend nginx
            
            # Wait for backend to be ready
            echo "⏳ Waiting for backend to be ready..."
            for i in {1..30}; do
              if docker exec project_saas_backend curl -f http://localhost:8000/health >/dev/null 2>&1; then
                echo "✓ Backend is ready"
                break
              fi
              echo "  Attempt $i/30..."
              sleep 2
            done
            
            # Copy nginx config to container volume
            echo "🔧 Copying nginx config..."
            cp nginx.prod.conf /tmp/nginx.prod.conf || true
            
            # Set permissions on frontend files
            echo "📄 Setting frontend permissions..."
            sudo chown -R www-data:www-data /var/www/html 2>/dev/null || true
            
            # Display service status
            echo "✅ Deployment complete!"
            docker-compose -f docker-compose-prod.yml ps
