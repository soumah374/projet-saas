name: CI - Build & Deploy Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: build_backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/project-backend:latest
            ghcr.io/${{ github.repository_owner }}/project-backend:${{ github.sha }}

      - name: Set backend image output
        run: echo "backend_image=ghcr.io/${{ github.repository_owner }}/project-backend:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Node.js for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          # Retry npm ci up to 3 times
          for i in 1 2 3; do
            npm ci && break || sleep 10
          done
          npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build and push frontend image
        id: build_frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/project-frontend:latest
            ghcr.io/${{ github.repository_owner }}/project-frontend:${{ github.sha }}

  deploy-to-vps:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Wait a moment
        run: echo "Starting remote deploy..."
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend-dist

      - name: Copy frontend to VPS (/var/www/html)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "./frontend-dist/*"
          target: /var/www/html

      - name: Deploy backend and finalize frontend
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            IMAGE=ghcr.io/${{ github.repository_owner }}/project-backend:${{ github.sha }}
            echo "Pulling $IMAGE"
            docker pull $IMAGE || true
            docker tag $IMAGE ghcr.io/${{ github.repository_owner }}/project-backend:latest || true
            # path where your docker-compose.yml lives on the VPS
            DEPLOY_PATH=${{ secrets.VPS_DEPLOY_PATH }}
            if [ -n "$DEPLOY_PATH" ]; then
              cd "$DEPLOY_PATH"
              docker-compose pull backend || true
              docker-compose up -d backend
            else
              echo "VPS_DEPLOY_PATH not set; attempting direct docker run"
              docker stop project_saas_backend || true
              docker rm project_saas_backend || true
              docker run -d --restart unless-stopped --name project_saas_backend -p 8000:8000 ghcr.io/${{ github.repository_owner }}/project-backend:latest
            fi
            # set permissions and reload nginx if available
            if command -v systemctl >/dev/null 2>&1; then
              chown -R www-data:www-data /var/www/html || true
              systemctl try-restart nginx || true
            fi
