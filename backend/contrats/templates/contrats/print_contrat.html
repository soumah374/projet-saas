<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impression du contrat</title>
    <style>
      body {
        width: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.7;
        color: #000000;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p>{{ contrat.contenu_personnalise|safe }}</p>

      <table
        style="
          width: 100%;
          margin: 30px 0;
          border-collapse: collapse;
          font-family: Arial, Helvetica, sans-serif;
        "
      >
        <tr>
          <td style="width: 50%; padding: 20px; text-align: center">
            <strong
              style="
                font-weight: bold;
                color: #000000;
                font-family: Arial, Helvetica, sans-serif;
              "
              >Le Prestataire</strong
            ><br />
            (signature)
          </td>
          <td style="width: 50%; padding: 20px; text-align: center">
            <strong
              style="
                font-weight: bold;
                color: #000000;
                font-family: Arial, Helvetica, sans-serif;
              "
              >Le Client</strong
            ><br />
            (signature)
          </td>
        </tr>
      </table>
    </div>
  </body>
