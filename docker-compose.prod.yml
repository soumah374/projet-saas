version: "3.8"

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-project_saas_db}
      - POSTGRES_USER=${DB_USER:-project_saas_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-project_saas_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - project_saas_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-project_saas_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - project_saas_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Django avec image du registry
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/YOUR_USERNAME/projet-saas/backend:latest}
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?error: SECRET_KEY must be set}
      - DB_NAME=${DB_NAME:-project_saas_db}
      - DB_USER=${DB_USER:-project_saas_user}
      - DB_PASSWORD=${DB_PASSWORD:?error: DB_PASSWORD must be set}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - project_saas_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - project_saas_network
    restart: unless-stopped

  # Mailpit - Email testing
  # mailpit:
  #   image: axllent/mailpit:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ./data-mailpit:/data
  #   ports:
  #     - "8025:8025"
  #     - "1025:1025"
  #   environment:
  #     MP_MAX_MESSAGES: 5000
  #     MP_DATABASE: /data/mailpit.db
  #     MP_SMTP_AUTH_ACCEPT_ANY: 1
  #     MP_SMTP_AUTH_ALLOW_INSECURE: 1
  #   networks:
  #     - project_saas_network

volumes:
  postgres_data:
  redis_data:
  media_volume:
  static_volume:

networks:
  project_saas_network:
    driver: bridge
